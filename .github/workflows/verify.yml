name: Verify released manuscript artifacts
on: [push, pull_request, workflow_dispatch]
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.4 matplotlib==3.10.9
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -B scripts/verify_artifacts.py
      - run: python -B tests/test_integrity.py --scratch ../integrity-scratch
      - run: python -B tests/test_manuscript_sync.py
      - run: python -B scripts/generate_manuscript_tables.py --output ../manuscript-tables
      - run: python -B scripts/generate_paper_tables.py --sources results/accepted_summaries --output ../transport-tables
      - run: python -B scripts/figures/plot_section4_1_transport_geometry.py --output-root ../figure1
      - run: python -B scripts/figures/plot_section4_2_functional_recovery.py --output-root ../figure2
